; ============================================================
; supervisord config for BMIS production (Linux)
; Usage: supervisord -c scripts/supervisord.conf
; Requires: pip install supervisor
; ============================================================

[supervisord]
nodaemon=true
logfile=logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/bmis-supervisord.pid

; ── FastAPI (Gunicorn + Uvicorn workers) ────────────────────
[program:api]
command=.venv/bin/gunicorn app.main:app -k uvicorn.workers.UvicornWorker --workers 4 --bind 0.0.0.0:8000 --timeout 60
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stdout_logfile=logs/api.log
stdout_logfile_maxbytes=10MB
stderr_logfile=logs/api_error.log

; ── Celery default worker ────────────────────────────────────
[program:celery-default]
command=.venv/bin/celery -A app.workers.celery_app worker -Q default --loglevel=warning --concurrency=4
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=logs/celery_default.log
stdout_logfile_maxbytes=10MB
stderr_logfile=logs/celery_default_error.log

; ── Celery priority worker ───────────────────────────────────
[program:celery-priority]
command=.venv/bin/celery -A app.workers.celery_app worker -Q priority --loglevel=warning --concurrency=2
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=logs/celery_priority.log
stdout_logfile_maxbytes=10MB
stderr_logfile=logs/celery_priority_error.log

; ── Celery Beat (scheduler) ──────────────────────────────────
[program:celery-beat]
command=.venv/bin/celery -A app.workers.celery_app beat --loglevel=warning
directory=%(here)s/..
autostart=true
autorestart=true
startsecs=10
stdout_logfile=logs/celery_beat.log
stdout_logfile_maxbytes=5MB
stderr_logfile=logs/celery_beat_error.log

; ── Group: stop/start everything at once ────────────────────
[group:bmis]
programs=api,celery-default,celery-priority,celery-beat
